<ng-container>
  <ng-container *ngFor="let result of data">
    <p [ngClass]="result[nameIndex]">{{result[nameIndex]}}
      <ng-container
        *ngFor="let morpheme of result[resultIndex]; last as isLast">
        <span [ngClass]="morpheme[morphType]">
          <ion-text
            color="{{morpheme[morphType]}}">{{ morpheme[tier.key] }}
          </ion-text>
        </span>
        <span *ngIf="!isLast" class="separator">{{ tier.separator }}</span>

      </ng-container>

      <lib-every-voice
        *ngIf="hasAudio"
        [textToGenerate]="rawText"></lib-every-voice>
    </p>
  </ng-container>
</ng-container>
